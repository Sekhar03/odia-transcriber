name: 🐛 Bug Report
description: Report a bug to help us improve OdiaTube AI Transcriber
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the form below as completely as possible.
  - type: input
    id: youtube_url
    attributes:
      label: YouTube Video URL
      description: If the issue occurred during transcription or PDF generation of a specific video, please provide the link here.
      placeholder: https://www.youtube.com/watch?v=...
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe what went wrong...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Browser version, Node.js version, etc.
      value: |
        - OS: [e.g. Windows, macOS]
        - Browser: [e.g. Chrome, Firefox]
        - Node Version (if running locally):
    validations:
      required: false
